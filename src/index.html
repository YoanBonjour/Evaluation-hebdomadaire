<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Evaluation continue 🦋</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="btn-container">
      <button class="btn primary">Label</button>
      <button class="btn primary btn-small">Label</button>
      <button class="btn secondary">Label</button>
      <button class="btn secondary btn-small">Label</button>
    </div>
    <div class="card-container">
      <div class="card">
        <img
          src="/src/img/sanFrancisco.png"
          alt="San Francisco bridge"
          class="card-img"
        />
        <div class="card-title">
          <h2>San Francisco</h2>
          <p>Premium economy</p>
        </div>
        <div class="card-infos">
          <div class="card-price">
            <img
              src="/src/img/svg/ticket.svg"
              alt="Ticket icon"
              class="card-infos-icon"
            />
            <p>From <span class="card-infos-bold">900 CHF</span></p>
          </div>
          <div class="card-airplane">
            <img
              src="/src/img/svg/plane.svg"
              alt="Plane icon"
              class="card-infos-icon"
            />
            <p class="card-infos-bold">SFO</p>
          </div>
        </div>
      </div>
      <div class="card-cta">
        <button class="btn primary btn-small">Search flight</button>
        <a href="#">
          <img
            src="/src/img/svg/heart.svg"
            alt="Heart icon"
            class="card-cta-icon"
          />
        </a>
      </div>
    </div>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
